app:
  env: prod
  port: 8080

mysql:
  dsn: app_user:change_me@tcp(mysql:3306)/compute_monitor?charset=utf8mb4&parseTime=True&loc=Local
  max_open_conns: 100
  max_idle_conns: 20

auth:
  jwt:
    secret: change-this-prod-secret
    issuer: compute-monitor-api
    access_token_ttl_seconds: 7200
  bootstrap_admin:
    enabled: false
    username: admin
    password: change-this-before-enable
    display_name: 系统管理员
    email: admin@example.com
    role: admin
    status: 1
