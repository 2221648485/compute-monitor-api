app:
  env: dev
  port: 8080

mysql:
  dsn: root:123456@tcp(127.0.0.1:3308)/compute_monitor_dev?charset=utf8mb4&parseTime=True&loc=Local
  max_open_conns: 20
  max_idle_conns: 10

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0

auth:
  jwt:
    secret: dev-compute-monitor-secret
    issuer: compute-monitor-api
    access_token_ttl_seconds: 7200
    refresh_token_ttl_seconds: 604800
  bootstrap_admin:
    enabled: true
    username: admin
    password: Admin@123456
    display_name: System Admin
    email: admin@example.com
    role: admin
    status: 1

k8s:
  mode: kubeconfig
  api_server: https://127.0.0.1:6443
  kubeconfig_path: configs/kubeconfig-demo.yaml

prometheus:
  api_server: http://127.0.0.1:9090

scheduler:
  k8s_sync:
    enabled: true
    interval_seconds: 60
    timeout_seconds: 30
    namespace: ""
