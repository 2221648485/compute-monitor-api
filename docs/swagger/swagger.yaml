basePath: /
definitions:
  auth.ChangePasswordRequest:
    properties:
      confirm_password:
        type: string
      new_password:
        maxLength: 72
        minLength: 8
        type: string
      old_password:
        type: string
    required:
    - confirm_password
    - new_password
    - old_password
    type: object
  auth.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  auth.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  cluster.CreateClusterRequest:
    properties:
      description:
        type: string
      id:
        type: string
      kubeconfigPath:
        type: string
      name:
        type: string
      prometheusURL:
        type: string
      status:
        type: string
    required:
    - id
    - name
    type: object
  cluster.UpdateClusterRequest:
    properties:
      description:
        type: string
      kubeconfigPath:
        type: string
      name:
        type: string
      prometheusURL:
        type: string
      status:
        type: string
    required:
    - name
    type: object
  migration.Condition:
    properties:
      metric:
        type: string
      operator:
        type: string
      unit:
        type: string
      value:
        type: number
    type: object
  migration.CreatePlanRequest:
    properties:
      conditions:
        items:
          $ref: '#/definitions/migration.Condition'
        type: array
      filters:
        $ref: '#/definitions/migration.Filters'
      intentType:
        type: string
      migrationRatio:
        type: integer
      sourceCluster:
        type: string
      sourceNode:
        type: string
      strategy:
        type: string
      targetCluster:
        type: string
      targetNode:
        type: string
      taskIds:
        items:
          type: string
        type: array
      timeWindow:
        type: string
    required:
    - intentType
    type: object
  migration.CreateTaskRequest:
    properties:
      mode:
        type: string
      planId:
        type: string
    required:
    - planId
    type: object
  migration.Filters:
    properties:
      gpuType:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      priority:
        type: string
    type: object
  migration.ParseIntentRequest:
    properties:
      instruction:
        type: string
      sourceType:
        type: string
    required:
    - instruction
    type: object
  migration.ProgressRequest:
    properties:
      currentStep:
        type: string
      message:
        type: string
      progressPercent:
        type: integer
      status:
        type: string
    type: object
  response.Body:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  user.CreateUserRequest:
    properties:
      display_name:
        maxLength: 64
        type: string
      email:
        maxLength: 128
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      phone:
        maxLength: 32
        type: string
      role:
        type: string
      status:
        type: integer
      username:
        maxLength: 64
        minLength: 3
        type: string
    required:
    - display_name
    - password
    - role
    - username
    type: object
  user.ResetPasswordRequest:
    properties:
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - password
    type: object
  user.UpdateUserRequest:
    properties:
      display_name:
        maxLength: 64
        type: string
      email:
        maxLength: 128
        type: string
      phone:
        maxLength: 32
        type: string
      role:
        type: string
    required:
    - display_name
    - role
    type: object
  user.UpdateUserStatusRequest:
    properties:
      status:
        type: integer
    required:
    - status
    type: object
