basePath: /
definitions:
  auth.ChangePasswordRequest:
    properties:
      confirm_password:
        type: string
      new_password:
        maxLength: 72
        minLength: 8
        type: string
      old_password:
        type: string
    required:
    - confirm_password
    - new_password
    - old_password
    type: object
  auth.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  cluster.CreateClusterRequest:
    properties:
      description:
        type: string
      id:
        type: string
      kubeconfig_path:
        type: string
      name:
        type: string
      prometheus_url:
        type: string
      status:
        type: string
    required:
    - id
    - name
    type: object
  cluster.UpdateClusterRequest:
    properties:
      description:
        type: string
      kubeconfig_path:
        type: string
      name:
        type: string
      prometheus_url:
        type: string
      status:
        type: string
    required:
    - name
    type: object
  response.Body:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  user.CreateUserRequest:
    properties:
      display_name:
        maxLength: 64
        type: string
      email:
        maxLength: 128
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      phone:
        maxLength: 32
        type: string
      role:
        type: string
      status:
        type: integer
      username:
        maxLength: 64
        minLength: 3
        type: string
    required:
    - display_name
    - password
    - role
    - username
    type: object
  user.ResetPasswordRequest:
    properties:
      password:
        maxLength: 72
        minLength: 8
        type: string
    required:
    - password
    type: object
  user.UpdateUserRequest:
    properties:
      display_name:
        maxLength: 64
        type: string
      email:
        maxLength: 128
        type: string
      phone:
        maxLength: 32
        type: string
      role:
        type: string
    required:
    - display_name
    - role
    type: object
  user.UpdateUserStatusRequest:
    properties:
      status:
        type: integer
    required:
    - status
    type: object
host: localhost:8080
info:
  contact: {}
  description: 算力监控平台后端 API 文档。
  title: Compute Monitor API
  version: "1.0"
paths:
  /api/admin/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登录请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Body'
        "500":
          description: Internal Server Error
